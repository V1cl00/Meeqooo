name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meeqo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meeqo-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx vite build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: meeqo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meeqo-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Dev-Server starten
        run: |
          ADMIN_EMAILS=admin@test.de npx vite dev --host 127.0.0.1 --port 8080 > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/login > /dev/null && break; sleep 2; done
      - run: npm run test:e2e
      - if: failure()
        run: tail -n 80 dev.log
