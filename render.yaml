# Render Blueprint for MeeQo (test deployment).
# Open: https://dashboard.render.com/blueprint/new?repo=https://github.com/V1cl00/Meeqooo
# No secrets in this file: BETTER_AUTH_SECRET is generated by Render,
# DATABASE_URL comes from the managed Postgres below.
services:
  - type: web
    name: meeqo
    runtime: node
    plan: free
    region: frankfurt
    branch: deploy-render
    autoDeploy: true
    rootDir: meeqo-app
    # Dev deps (vite, nitro, …) are needed for the build.
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build:node
    # Applies migrations to DATABASE_URL, sets BETTER_AUTH_URL from
    # RENDER_EXTERNAL_URL (https://<name>.onrender.com), starts .output/server/index.mjs.
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_EMAILS
        value: admin@test.de
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: meeqo-db
          property: connectionString

databases:
  - name: meeqo-db
    plan: free
    region: frankfurt
    databaseName: meeqo
    user: meeqo
    postgresMajorVersion: "16"
